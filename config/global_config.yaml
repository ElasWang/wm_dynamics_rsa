# config/global.yaml
# 项目全局配置文件（修改此文件无需改动任何 .py 代码）

project:
  name: "WM Dynamics RSA"
  version: "1.0.0"

# 数据路径
paths:
  bids_root: "./data/raw"
  deriv_root: "./data/derivatives"
  all_trials: "/data/behavior"
  visual_similarity_root: "./data/visual_similarity"
  model_rdm_root: "./results/rdms/model"
  neural_rdm_root: "./results/rdms/neural"
  null : "./results/null"
  rsa_result : "./results/rsa"
  figures_result: "./results/figures"
  figures_debug: './results/figures/debug'
  figures_group: './results/figures/group'
  figures: './results/figures'
  split_half_qc_path: 'results/qc/split_half_qc.csv'

# eeg数据预处理参数
preprocessing:
  resample_sfreq: 250        # 统一采样率 (Hz)
  filter_low: 0.1           # 高通截止频率 (Hz)
  filter_high: 50          # 低通截止频率 (Hz)
  epoch_tmin: -0.2           # 刺激前基线起始 (秒)
  epoch_tmax: 0.8            # 刺激后结束 (秒)
  baseline: [-0.2, 0.0]      #基线矫正用刺激前-200cm到0cm的平均值做基线
  whiten: false #使用噪声归一化后的数据计算 RDM
  reject:
    eeg: 100     #剔除（100µV）
  asr:
    flatline_criterion: 5
    channel_criterion: 0.8
    line_noise_criterion: 4
    burst_criterion: 20
    highpass: 'off'
  ica_algorithm: 'infomax'
  ica_extended: true
  ica_pca_n_components: 0.99  # 自动
  iclabel_threshold: 0.8
  interpolation_method: 'spherical'

# RSA 分析参数
rsa:
  # 时间窗口参数
  temporal_window: 0.025       # 窗口宽度 (秒)
  temporal_step: 0.02          # 滑动步长 (秒)
  spatial_radius: 0.04         # Searchlight 半径 (米)
  dist_metric: "correlation"   # 神经RDM距离 (correlation / euclidean)
  n_folds: 1                   # >1 表示使用交叉验证，1 直接平均
  n_jobs: 1                    #rdm_epochs 进行并行计算
  excluded_subjects: ['022', '023']  #被试幅值 0.2~0.4 µV，数据报废直接排除

  tmin: -0.2                # 分析起始时间（建议 -0.1 或 0.0，排除滤波振铃）
  tmax: 0.8                 # 分析结束时间
  h2_window: [0.3, 0.5]
  h3_encoding: [0.25, 0.35]   # 根据 H1 结果调整为实际显著峰值
  h3_maintenance: [0.45, 0.65]  # 保持 100ms 间隔，整体平移
  train_indices: [200, 500] #训练窗口（编码期）
  test_indices: [600, 800] #测试窗口（维持期）
  pattern_normalization: null
  n_perm: 5000 #置换检验
  min_split_half: 0.05
  stat_tmin: 0.0
  stat_tmax: 800.0
  min_cluster_points: 3
  correct_pairwise_fdr: false
  folds: 5 #将所有 trial 随机分成 5 折
  statistics:
    # 置换检验配置
    n_permutations: 10       # 打乱基线的置换次数（调试时可改为 100）
    random_state: 42           # 固定随机种子，确保结果可复现

    # 聚类置换检验
    cluster_threshold: 2.0     # 聚类形成的 t 值阈值
    cluster_alpha: 0.05        # 显著性水平

    # 质量控制
    reliability_threshold: 0.5 # 拆分半信度最低阈值（低于此值丢弃时间窗）
    max_dropout_rate: 0.25     # 最大允许的试次剔除率

# RNN 建模参数
rnn:
  hidden_size: 64
  learning_rate: 0.001
  n_epochs: 200
  batch_size: 32

model_rdm:
  structure_weights: [0.0, 0.3, 0.5, 0.7, 1.0]
  distractor_collapse_levels: [0.0, 0.5, 1.0]
  chunking_pattern:
    - [ 4,4 ]
    - [ 2,3,3 ]
    - [ 2,4,2 ]
    - [ 3,2,3 ]
    - [ 3,3,2 ]
    - [ 4,2,2 ]
    - [ 2,2,2,2 ]
  content_lambda_param: 1


